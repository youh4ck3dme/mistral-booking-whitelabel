name: CI

on:
  push:
    branches:
      - main
      - 'feat/*'
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/*'
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Build, Lint, Typecheck & SQL Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgrespassword
      PGDATABASE: postgres
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.fake
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.fake
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NOTIFICATION_CRON_SECRET: test-cron-secret-for-ci-runs-32-chars-minimum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Krok 1 - Inštalácia závislostí s cache
        run: pnpm install --frozen-lockfile

      - name: Krok 2 - Typecheck
        run: pnpm --filter @repo/web exec tsc --noEmit

      - name: Krok 3 - Linter
        run: pnpm lint

      - name: Krok 4 - Testy
        run: pnpm test

      - name: Krok 5 - PostgreSQL Service Container & SQL Guard testy
        run: |
          echo "Inštalujem PostgreSQL klientske nástroje..."
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

          echo "Čakám na dostupnosť PostgreSQL kontajnera..."
          until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
            sleep 1
          done

          echo "Inicializujem bootstrap schému (auth stub, users, role, extenzie)..."
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f scripts/ci_test_bootstrap.sql

          echo "Aplikujem migrácie 001 až 018 v poradí..."
          for migration in $(ls supabase/migrations/*.sql | sort); do
            echo "--> Aplikujem migráciu: $migration"
            psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f "$migration"
          done

          echo "Spúšťam SQL Guard verifikačné testy..."
          echo "--> Test 1: booking_concurrency_verification.sql"
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f supabase/tests/booking_concurrency_verification.sql

          echo "--> Test 2: active_staff_guard_verification.sql"
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f supabase/tests/active_staff_guard_verification.sql

          echo "--> Test 3: booking_manage_verification.sql"
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f supabase/tests/booking_manage_verification.sql

          echo "--> Test 4: staff_availability_verification.sql"
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f supabase/tests/staff_availability_verification.sql

          echo "--> Test 5: reminder_pipeline_verification.sql"
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f supabase/tests/reminder_pipeline_verification.sql

          echo "--> Test 6: least_privilege_verification.sql"
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 -f supabase/tests/least_privilege_verification.sql

          echo "VŠETKY SQL MIGRÁCIE A CONCURRENCY TESTY PREŠLI ÚSPEŠNE!"

      - name: Krok 6 - Produkčný build
        run: pnpm build
