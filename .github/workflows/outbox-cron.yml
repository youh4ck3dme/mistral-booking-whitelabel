name: Outbox Delivery Worker Cron

on:
  schedule:
    # Trigger every 10 minutes (free on GitHub Actions, bypasses Vercel Hobby limits)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  trigger-outbox:
    name: Process Pending Notifications Outbox
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Process Outbox Endpoint
        env:
          APP_URL: ${{ secrets.VERCEL_APP_URL || 'https://mistral-booking.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning ::CRON_SECRET is not set in repository secrets. Skipping outbox trigger."
            exit 0
          fi

          echo "Triggering outbox processing at ${APP_URL}/api/cron/process-outbox..."
          curl -f -s -S -X POST "${APP_URL}/api/cron/process-outbox" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 15 || {
              echo "::error ::Failed to trigger outbox endpoint"
              exit 1
            }
          echo "Outbox triggered successfully."
